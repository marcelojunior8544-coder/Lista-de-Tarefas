<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Lista de Tarefas</h1>

        <form id="task-form" class="task-form">
            <input
                type="text"
                id="task-input"
                placeholder="Digite uma nova tarefa"
                aria-label="Nova tarefa"
                required
            >
            <button type="submit">Adicionar</button>
        </form>

        <div id="status" class="status" aria-live="polite"></div>

        <section class="tasks-panel">
            <h2>Minhas tarefas</h2>
            <ul id="task-list" class="task-list" aria-live="polite"></ul>
        </section>
    </main>

    <script>
        const API_URL = '/tarefas';
        const taskForm = document.getElementById('task-form');
        const taskInput = document.getElementById('task-input');
        const taskList = document.getElementById('task-list');
        const statusBox = document.getElementById('status');

        function showStatus(message, isError = false) {
            statusBox.textContent = message;
            statusBox.classList.toggle('error', isError);
        }

        function renderTasks(tasks) {
            taskList.innerHTML = '';

            if (!tasks || tasks.length === 0) {
                const emptyItem = document.createElement('li');
                emptyItem.className = 'empty';
                emptyItem.textContent = 'Nenhuma tarefa cadastrada.';
                taskList.appendChild(emptyItem);
                return;
            }

            tasks.forEach((task, index) => {
                const item = document.createElement('li');
                item.className = 'task-item';

                const taskText = document.createElement('span');
                taskText.className = 'task-text';
                taskText.textContent = `${index + 1}. ${task}`;

                const removeButton = document.createElement('button');
                removeButton.type = 'button';
                removeButton.className = 'remove-btn';
                removeButton.dataset.index = String(index + 1);
                removeButton.textContent = 'Excluir';

                item.appendChild(taskText);
                item.appendChild(removeButton);
                taskList.appendChild(item);
            });
        }

        async function carregarTarefas() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error('Não foi possível carregar as tarefas.');
                }

                const tasks = await response.json();
                renderTasks(tasks);
            } catch (error) {
                renderTasks([]);
                showStatus(error.message, true);
            }
        }

        taskForm.addEventListener('submit', async (event) => {
            event.preventDefault();

            const tarefa = taskInput.value.trim();

            if (!tarefa) {
                showStatus('Digite uma tarefa válida antes de adicionar.', true);
                return;
            }

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ tarefa })
                });

                const payload = await response.json().catch(async () => ({ detail: await response.text() }));

                if (!response.ok) {
                    throw new Error(payload.detail || 'Não foi possível adicionar a tarefa.');
                }

                taskInput.value = '';
                showStatus(`Tarefa adicionada: ${payload}`);
                await carregarTarefas();
            } catch (error) {
                showStatus(error.message, true);
            }
        });

        taskList.addEventListener('click', async (event) => {
            const button = event.target.closest('.remove-btn');
            if (!button) return;

            const numero = Number(button.dataset.index);

            try {
                const response = await fetch(`${API_URL}/${numero}`, { method: 'DELETE' });
                const payload = await response.json().catch(async () => ({ detail: await response.text() }));

                if (!response.ok) {
                    throw new Error(payload.detail || 'Não foi possível remover a tarefa.');
                }

                showStatus(`Tarefa removida: ${payload}`);
                await carregarTarefas();
            } catch (error) {
                showStatus(error.message, true);
            }
        });

        carregarTarefas();
    </script>
</body>
</html>
